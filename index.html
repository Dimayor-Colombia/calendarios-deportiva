     DISEÑO FIJO PARA PANTALLA 1920 x 1080 (Full HD)

  :root{
    color-scheme: light only;
    --navy-900:#03122b;
    --navy-800:#061d40;
    --navy-700:#0a2a5c;
    --blue:#0063cc;
    --blue-dark:#004c99;
    --sky:#7cc4ff;
    --gold:#f3cc23;
    --white:#ffffff;
    --ink:#0f172a;
    --muted:#64748b;
    --line:#e2e8f0;
    --live:#e11d48;
    --live-soft:#ffe4ea;
    --done:#475569;
    --done-soft:#eef1f5;
    --page-seconds:10s;

  /* AJUSTE A LA PANTALLA SOLO CON CSS (funciona aunque el navegador de la TV sea viejo):
     el diseño mide 120 x 67.5 rem; 1rem = 1/120 del ancho de la pantalla. */
  html{ font-size:calc(100vw / 120); -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  @media (min-aspect-ratio: 16/9){ html{ font-size:calc(100vh / 67.5); } }
  *{ box-sizing:border-box; }
  html,body{
    width:100%; height:100%; margin:0; padding:0; overflow:hidden;
    font-family:'DM Sans', sans-serif; color:var(--white);
    background:
      radial-gradient(56.25rem 31.25rem at 8% -10%, rgba(0,99,204,.55), transparent 65%),
      radial-gradient(50rem 31.25rem at 100% 110%, rgba(0,99,204,.35), transparent 65%),
      linear-gradient(180deg, var(--navy-800), var(--navy-900));
  }
  /* El diseño se arma en 1920x1080 y se escala completo para llenar cualquier pantalla
     (720p, 1080p, 4K, portátil, TV, etc.) sin deformarse ni cortar nada. */
  #stage{
    position:absolute; left:50%; top:50%;
    width:120rem; height:67.5rem; margin-left:-60rem; margin-top:-33.75rem;
  }
  .board{ width:100%; height:100%; display:flex; flex-direction:column; }

  /* ---------- Encabezado ---------- */
  header{
    height:6rem; flex:0 0 6rem;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 2.5rem;
    border-bottom:1px solid rgba(255,255,255,.08);
  }
  .brand{ display:flex; align-items:center; gap:1.375rem; }
  .brand img{ height:2.875rem; }
  .brand .sep{ width:2px; height:2.75rem; background:rgba(255,255,255,.18); border-radius:2px; }
  .brand .t1{ font-size:1.875rem; font-weight:800; letter-spacing:.01em; line-height:1.05; }
  .brand .t2{ font-size:0.9375rem; color:rgba(255,255,255,.6); margin-top:0.25rem; letter-spacing:.04em; text-transform:uppercase; }
  .headRight{ display:flex; align-items:center; gap:1.75rem; }
  .livePill{
    display:none; align-items:center; gap:0.625rem;
    background:var(--live); color:#fff; font-weight:800; font-size:1.0625rem; letter-spacing:.06em;
    padding:0.5625rem 1.125rem; border-radius:1.875rem; text-transform:uppercase;
    box-shadow:0 0 0 0 rgba(225,29,72,.6); animation:pillPulse 2s infinite;
  }
  .livePill.show{ display:flex; }
  .livePill .dot{ width:0.625rem; height:0.625rem; border-radius:50%; background:#fff; animation:blink 1s infinite; }
  .clock{ text-align:right; }
  .clock .time{ font-family:'DM Mono', monospace; font-size:2.375rem; font-weight:500; line-height:1; }
  .clock .date{ font-size:0.9375rem; color:rgba(255,255,255,.65); margin-top:0.375rem; }

  /* ---------- Columnas de días ---------- */
  main{
    height:58.75rem; flex:0 0 58.75rem;
    display:grid; grid-template-columns:repeat(5, 1fr); gap:1.25rem;
    padding:1.5rem 1.5rem 1.5rem;
    transition:opacity .7s ease;
  }
  main.dimmed{ opacity:0; }

  .day{
    height:55.75rem; display:flex; flex-direction:column;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.09);
    border-radius:1.25rem; overflow:hidden;
  }
  .day.today{
    background:rgba(0,99,204,.16);
    border:2px solid rgba(124,196,255,.55);
    box-shadow:0 0 2.5rem rgba(0,99,204,.35);
  }

  .dayHead{
    height:5.25rem; flex:0 0 5.25rem;
    display:flex; align-items:center; gap:1rem; padding:0 1.25rem;
    border-bottom:1px solid rgba(255,255,255,.08);
  }
  .day.today .dayHead{ background:linear-gradient(135deg, var(--blue), var(--blue-dark)); border-bottom-color:transparent; }
  .dayNum{
    width:3.5rem; height:3.5rem; flex:0 0 3.5rem; border-radius:0.875rem;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(255,255,255,.1); line-height:1;
  }
  .day.today .dayNum{ background:#fff; color:var(--blue-dark); }
  .dayNum b{ font-family:'DM Mono', monospace; font-size:1.625rem; font-weight:500; }
  .dayNum small{ font-size:0.6875rem; text-transform:uppercase; letter-spacing:.08em; margin-top:0.1875rem; opacity:.75; }
  .dayInfo{ flex:1; min-width:0; }
  .dayName{ font-size:1.375rem; font-weight:800; text-transform:uppercase; letter-spacing:.05em; display:flex; align-items:center; gap:0.625rem; }
  .todayChip{
    font-size:0.75rem; font-weight:800; letter-spacing:.1em;
    background:var(--gold); color:var(--navy-900); padding:0.25rem 0.5625rem; border-radius:0.375rem;
  }
  .dayCount{ font-size:0.875rem; color:rgba(255,255,255,.6); margin-top:0.25rem; }
  .day.today .dayCount{ color:rgba(255,255,255,.85); }

  /* ---------- Cuerpo del día: páginas de 5 partidos ---------- */
  .dayBody{ position:relative; flex:1 1 auto; }
  .page{
    position:absolute; top:0; left:0; right:0; bottom:0;
    display:flex; flex-direction:column; gap:0.75rem; padding:0.75rem;
    opacity:0; transform:translateY(1.5rem); pointer-events:none;
    transition:opacity .6s ease, transform .6s cubic-bezier(.16,1,.3,1);
  }
  .page.active{ opacity:1; transform:none; }
  .page .match{ opacity:0; transform:translateX(-0.875rem); transition:opacity .45s ease, transform .45s cubic-bezier(.16,1,.3,1); }
  .page.active .match{ opacity:1; transform:none; }
  .page.active .match:nth-child(2){ transition-delay:.06s; }
  .page.active .match:nth-child(3){ transition-delay:.12s; }
  .page.active .match:nth-child(4){ transition-delay:.18s; }
  .page.active .match:nth-child(5){ transition-delay:.24s; }

  .empty{
    position:absolute; top:0; left:0; right:0; bottom:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0.625rem;
    color:rgba(255,255,255,.4); font-size:1.125rem; font-weight:500;
  }
  .empty .ball{ font-size:2.625rem; opacity:.5; }

  /* ---------- Tarjeta de partido (alto fijo: 5 por columna) ---------- */
  .match{
    height:8.75rem; flex:0 0 8.75rem; position:relative;
    display:flex; flex-direction:column; justify-content:space-between;
    background:#fff; color:var(--ink);
    border-radius:0.875rem; padding:0.8125rem 1rem 0.75rem 1.375rem; overflow:hidden;
    box-shadow:0 0.375rem 1.125rem rgba(0,0,0,.25);
  }
  .match::before{
    content:''; position:absolute; left:0; top:0; bottom:0; width:0.4375rem;
    background:var(--comp-color);
  }
  .match .top{ display:flex; align-items:center; justify-content:space-between; gap:0.625rem; height:1.375rem; }
  .comp{
    display:flex; align-items:center; gap:0.4375rem; min-width:0;
    font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--muted);
  }
  .comp img{ width:1.25rem; height:1.25rem; object-fit:contain; flex:0 0 1.25rem; }
  .comp span{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .badge{
    flex:0 0 auto; display:inline-flex; align-items:center; gap:0.375rem;
    font-size:0.75rem; font-weight:800; letter-spacing:.07em; text-transform:uppercase;
    padding:0.25rem 0.625rem; border-radius:1.25rem; white-space:nowrap;

  .badge.live{ background:var(--live-soft); color:var(--live); }
  .badge.live .dot{ width:0.5rem; height:0.5rem; border-radius:50%; background:var(--live); animation:blink 1s infinite; }
  .badge.done{ background:var(--done-soft); color:var(--done); }

  .title{
    font-size:1.25rem; font-weight:800; line-height:1.18; letter-spacing:-.005em;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .bottom{ display:flex; align-items:flex-end; justify-content:space-between; gap:0.75rem; height:1.75rem; }
  .venue{
    font-size:0.8125rem; color:var(--muted); min-width:0;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding-bottom:0.1875rem;

  .score{ display:flex; align-items:baseline; gap:0.5rem; white-space:nowrap; line-height:1; }

  .legend{ display:flex; gap:1.5rem; flex:1; justify-content:center; }
  .legend span{ display:inline-flex; align-items:center; gap:0.5rem; white-space:nowrap; }
  .legend i{ width:0.75rem; height:0.75rem; border-radius:0.1875rem; }
  .online{ display:flex; align-items:center; gap:0.5rem; color:#34d399; font-weight:600; }
  .online i{ width:0.5625rem; height:0.5625rem; border-radius:50%; background:#34d399; box-shadow:0 0 0.5rem #34d399; animation:blink 1.6s infinite; }

  /* ---------- Imágenes de Drive ---------- */
  .overlay{
    position:fixed; top:0; left:0; width:100%; height:100%; z-index:50;
    display:flex; align-items:center; justify-content:center; background:#000;
    opacity:0; visibility:hidden; transition:opacity .7s ease, visibility .7s ease;
  }
  .overlay.visible{ opacity:1; visibility:visible; }
  .overlay img{ max-width:100%; max-height:100%; object-fit:contain; animation:fadeIn .6s ease both; }

  @keyframes blink{ 0%,100%{opacity:1;} 50%{opacity:.3;} }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  @keyframes fill{ from{width:0;} to{width:100%;} }
  @keyframes pillPulse{ 0%{box-shadow:0 0 0 0 rgba(225,29,72,.55);} 70%{box-shadow:0 0 0 0.875rem rgba(225,29,72,0);} 100%{box-shadow:0 0 0 0 rgba(225,29,72,0);} }

    0%,100%{ box-shadow:0 0 0 0.1875rem var(--live), 0 0.375rem 1.375rem rgba(225,29,72,.45); }

  }
</style>

}
document.documentElement.style.setProperty("--page-seconds", CONFIG.PAGE_SECONDS + "s");
renderClock();
loadEvents();
fetchDriveImages();
scheduleView();
setInterval(flipPages, CONFIG.PAGE_SECONDS * 1e3);
setInterval(tick, CONFIG.TICK_MS);
setInterval(loadEvents, CONFIG.REFRESH_EVENTS_MS);
setInterval(fetchDriveImages, CONFIG.DRIVE_REFRESH_MS);
</script>
</body>
</html>
